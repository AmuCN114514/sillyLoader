modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "sillyloader"
version = "0.5.2-beta"
displayName = "sillyLoader"
logoFile = "sillyloader.png"
description = '''
sillyLoader 是一个 NeoForge 二级模组加载器。
把带有 @SillyMod 注解的 jar 放入游戏目录下的 ./sillymods/ 文件夹，即可在启动时动态加载，无需重新构建整合包。

支持依赖解析与循环依赖检测、重名模组过滤、事件总线注册，以及退出时释放类加载器。
'''
authors = "AmuCN"

[[dependencies.sillyloader]]
modId = "neoforge"
mandatory = true
versionRange = "[26,)"
ordering = "NONE"
side = "BOTH"
